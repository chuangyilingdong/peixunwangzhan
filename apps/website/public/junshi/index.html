<div id="js-app">
<style>
#js-app{
  /* ── 颜色 ─────────────────────────────────────────────
     用 light-dark() 一套声明吃两种主题（Apple §12：大面用重材质、交互元素用轻材质）。 */
  --bg: light-dark(#f0f2f7,#0b0e12);
  --surface: light-dark(#ffffff,#171b21);
  --surface-2: light-dark(#f5f7fa,#1c2128);
  --surface-3: light-dark(#eceff5,#222831);
  --line: light-dark(#e3e7ee,#272e37);
  --line-soft: light-dark(#edf0f5,#20262e);
  --text: light-dark(#0e131b,#e8edf4);
  --text-2: light-dark(#5a6575,#95a1b2);
  --text-3: light-dark(#8b96a5,#68727f);
  --brand: light-dark(#2c47d4,#8296ff);
  --brand-soft: light-dark(#eaeeff,#1a2140);
  --warm: light-dark(#b0620f,#e9a457);
  --warm-soft: light-dark(#fdf2e4,#2a2015);
  --green: light-dark(#12734a,#4ecb8f);
  --red: light-dark(#b43426,#ff8f7e);
  --red-soft: light-dark(#fdeae7,#2b1917);

  /* ── 动效 token ───────────────────────────────────────
     Emil：内置 CSS 缓动太弱，要用更强的自定义曲线；UI 动画一律 <300ms。
     进场上用 ease-out（起步快＝跟手），屏内位移用 ease-in-out，hover/颜色用 ease，
     持续运动（转圈）用 linear。**不用 ease-in**。 */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --t-press: 140ms;    /* 按压反馈 100–160ms */
  --t-enter: 220ms;    /* 小面板进场 125–200ms 档，略放宽 */
  --t-panel: 260ms;    /* 面板切换 200–500ms 档 */

  --r: 12px;
  display:grid; grid-template-rows:auto minmax(0,1fr);
  height:100dvh; overflow:hidden;
  color:var(--text); line-height:1.6;
  background:var(--bg);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#js-app *,#js-app *::before,#js-app *::after{box-sizing:border-box}
#js-app [hidden]{display:none!important}
#js-app p{margin:0}
#js-app button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
#js-app svg.ic{width:1em;height:1em;flex:none;display:block}

/* ── 顶栏（Apple §12：半透明材质 + 内容从下面滚过；不占一条不透光的横带） */
#js-app .topbar{
  display:flex;align-items:center;gap:12px;padding:0 18px;height:52px;flex-wrap:nowrap;
  background:color-mix(in srgb, var(--surface) 78%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-soft);
  position:relative;z-index:5;
}
#js-app .brand{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
#js-app .mark{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,var(--brand),color-mix(in srgb,var(--brand) 60%, #7b5cff));
  color:#fff;font-size:11px;font-weight:600;
}
#js-app .topmeta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3);white-space:nowrap}
#js-app .iconbtn{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;color:var(--text-2);
  transition:background var(--t-press) var(--ease), color var(--t-press) var(--ease);
}
#js-app .iconbtn:hover{background:var(--surface-3);color:var(--text)}
#js-app .iconbtn:active{transform:scale(.94)}
#js-app .iconbtn.swapping svg.ic{animation:icon-swap 240ms var(--ease-out)}
@keyframes icon-swap{from{opacity:0;transform:rotate(-45deg) scale(.75)}to{opacity:1;transform:none}}

/* ── 骨架 ──
   ⚠️⚠️ 高度链必须**每一层都写成确定值**，不然内部 overflow:auto 不生效、内容一长就把
   输入框顶出视口，而外层是 overflow:hidden ——「往下拉也没用」。
   踩过的坑（2026-10-15 用户实测）：原来 `.body` 与 `.chatwrap` 只给了 grid-template-columns，
   行是**隐式 auto 行**，行高按内容撑开；`.main` 于是没有确定高度，一路传下去 `.msgs` 的
   overflow-y:auto 就成了摆设。短回复看不出来，真模型的长回答一出现就露馅。
   → 凡是「外壳行」一律显式写 `grid-template-rows: minmax(0,1fr)`。 */
#js-app .body{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;overflow:hidden}
#js-app .side{
  background:var(--surface);border-right:1px solid var(--line-soft);
  padding:10px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow-y:auto;
}
#js-app .navitem{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13px;
  color:var(--text-2);width:100%;
  transition:background var(--t-press) var(--ease), color var(--t-press) var(--ease);
}
#js-app .navitem svg.ic{font-size:17px;opacity:.85}
#js-app .navitem:hover{background:var(--surface-2);color:var(--text)}
#js-app .navitem:active{transform:scale(.985)}
#js-app .navitem[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:500}
#js-app .navitem[aria-current="true"] svg.ic{opacity:1}
#js-app .sidenote{
  margin:auto 6px 2px;font-size:11px;color:var(--text-3);border-top:1px solid var(--line-soft);
  padding-top:12px;line-height:1.7;
}
#js-app .main{padding:14px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
#js-app .screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ── 面板 ── */
#js-app .panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);min-width:0}
#js-app .ptitle{
  display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:-.005em;
  padding:12px 14px;border-bottom:1px solid var(--line-soft);
}
#js-app .ptitle small{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:400;letter-spacing:0}

/* ── 对话三栏：填满剩余高度，只有消息区内部滚动（app 手感，不是长网页）
   grid-template-rows 同样要显式给，理由见上面「高度链」那段。 */
#js-app .chatwrap{display:grid;grid-template-columns:206px minmax(0,1fr) 244px;grid-template-rows:minmax(0,1fr);gap:12px;align-items:stretch;flex:1;min-height:0}
#js-app .conv{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:0;overflow:hidden}
/* 整面板换内容（切专家 / 回到上次会话）时的一次轻换气：只透明度 + 4px 上浮。
   大表面不做缩放——Apple：大幅位移的大面积元素要一边走一边淡。 */
#js-app .conv.swap{animation:panel-in var(--t-enter) var(--ease-out)}
@keyframes panel-in{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
#js-app .convhead{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-soft);flex-wrap:nowrap}
#js-app .eavatar{
  width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:600;
  transition:background var(--t-press) var(--ease), color var(--t-press) var(--ease);
}
#js-app .convhead b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;display:block}
#js-app .convhead span{font-size:11px;color:var(--text-3);display:block;margin-top:1px}
/* ⚠️ grid-area:2/1 要和下面 .jump 一起显式给：只给 .jump 显式占位的话，
   自动布局会跳过第 2 行、把 .msgs 挤到第 3 行（实测过，消息区矮一半、还错位）。 */
#js-app .msgs{grid-area:2/1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;overscroll-behavior:contain}
/* 「回到最新」：和消息区占同一格（grid-area:2/1）浮在底部，消息从它下面滚过。
   进场 200ms、出场 150ms（Emil：出场要比进场快）；空间一致 —— 内容在下面，就从下面 8px 上来。 */
#js-app .jump{
  grid-area:2/1;place-self:end center;margin-bottom:10px;z-index:3;
  display:inline-flex;align-items:center;font-size:12px;padding:6px 13px;border-radius:999px;
  border:1px solid var(--line);color:var(--text);
  background:color-mix(in srgb,var(--surface) 86%, transparent);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 6px 18px -8px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out);
}
#js-app .jump.show{opacity:1;pointer-events:auto;transform:translateY(0);transition-duration:200ms}
#js-app .jump:active{transform:translateY(0) scale(.96)}
#js-app .msg{display:flex;gap:10px;align-items:flex-start}
/* 进场只给「新出现的那条」加 .enter：整表重排时不重放（重放＝刚读完的一屏无端抖一下；本地实测到过） */
#js-app .msg.enter{animation:bubble-in var(--t-enter) var(--ease-out) both}
#js-app .msg.me{flex-direction:row-reverse}
@keyframes bubble-in{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
#js-app .mavatar{
  width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;
  background:var(--brand);color:#fff;
}
#js-app .msg.me .mavatar{background:var(--surface-3);color:var(--text-2)}
#js-app .bubble{
  background:var(--surface-2);border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.78;
  max-width:min(720px,86%);white-space:pre-wrap;word-break:break-word;
}
#js-app .msg.me .bubble{background:var(--brand);color:#fff}
#js-app .status{
  font-size:11.5px;color:var(--text-3);padding:0 0 0 38px;display:flex;align-items:center;gap:6px;
  min-height:18px;animation:bubble-in var(--t-enter) var(--ease-out) both;
}
#js-app .status svg.ic{font-size:13px;animation:spin 720ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

          <input type="text" id="js-q" placeholder="搜方案、话术、文案、表格…（可多词，如：中秋 物料）" aria-label="搜索知识库">
          <span style="font-size:11px" id="js-count"></span>
        </div>
        <div class="chips" id="lib-scenes" role="group" aria-label="场景"></div>
        <div class="lib" id="js-lib"></div>
      </div>
    </section>

    <section class="screen" id="scr-compliance" hidden aria-label="合规体检">
      <div class="panel scroll">
        <div class="ptitle" style="padding:0 0 11px;border:0"><svg class="ic" width="15" height="15" aria-hidden="true"><use href="#i-shield"></use></svg>贴一段文案，我帮你过一遍</div>
        <textarea class="ta" id="cs-text" placeholder="把要发朋友圈、发群、印在海报上的文案贴进来。例如：我们是烟台最大的美术教育机构……"></textarea>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn primary" type="button" id="cs-run"><svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-check"></use></svg>开始检查</button>
          <button class="btn" type="button" id="cs-demo"><svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-bulb"></use></svg>填一段示例</button>
        </div>
        <div id="cs-out" style="margin-top:14px"></div>
      </div>
    </section>

    <section class="screen" id="scr-profile" hidden aria-label="机构画像">
      <div class="cast"><p id="pf-cast">这是整个产品的底座：你填一次，专家回答时就会结合你的品类、价格、校区，而不是给通用套话。</p></div>
      <div class="grid2">
        <div class="panel">
          <div class="ptitle">画像分组<small id="pf-percent"></small></div>
          <div style="padding:10px 12px"><div class="bar"><i id="pf-bar" style="width:0%"></i></div></div>
          <div id="pf-groups" style="padding:0 6px 8px" role="group" aria-label="画像分组"></div>
        </div>
        <div class="panel scroll">
          <div class="ptitle" id="pf-title" style="padding:0 0 11px;border:0">基本信息</div>
          <div id="pf-fields"></div>
          <div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center">
            <button class="btn primary" type="button" id="pf-save">保存</button>
            <span class="lead" id="pf-msg"></span>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>
</div>
