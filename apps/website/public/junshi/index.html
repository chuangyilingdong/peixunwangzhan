<!--
  /junshi/ —— 招生军师 · 专家团（2026-10-15）

  形态：**机构跟 AI 聊**。左侧是专家（营销/话术/文案/转化/续费/合规），中间是对话，
  右侧显示这次回答引用了他们自己资料库里的哪几份文件。
  专家定义与知识检索在 apps/server/src/services/junshiChat.js，
  接口（/experts、/chat 等）在 apps/server/src/routes/junshi.js。

  ⚠️ 脚本必须外链：线上 CSP 是 `script-src 'self'`（见 deploy/production/nginx-site.conf），
     **内联 <script> 会被直接拦掉**。`<style>` 保持内联——`style-src` 本来就放行内联样式。
  ⚠️ 两个 script 上的 `?v=__STAMP__` 由 apps/website/scripts/stamp-junshi.mjs 在构建时换成
     内容哈希，**别手工改成固定值**：nginx 的 /assets/ 是 expires 7d，URL 不变就会拿旧缓存。
  ⚠️ 按用户口径「暂时先不对外展示」：noindex + 未挂导航。
-->

<html lang="zh-CN">
<head>

<title>招生军师 · 专家团 · 灵动ai学院</title>
<style>
  :root{color-scheme:light dark}
  html,body{margin:0;padding:0}
  body{
    background:#eceff5;color:#131922;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:18px 16px 44px;
  }
  @media (prefers-color-scheme:dark){body{background:#0a0d11;color:#e7ecf3}}
  .jn-wrap{max-width:1440px;margin:0 auto}
  .jn-toggle{
    position:fixed;right:16px;bottom:16px;z-index:99;font:inherit;font-size:12px;
    padding:6px 13px;border-radius:999px;cursor:pointer;opacity:.5;
    background:transparent;border:1px solid currentColor;color:inherit;backdrop-filter:blur(6px);
  }
  .jn-toggle:hover{opacity:1}
</style>
</head>
<body>
<div class="jn-wrap">
<div id="js-app">
<style>
#js-app{
  --p-window: light-dark(#f6f8fb,#12161b);
  --p-surface: light-dark(#ffffff,#181d24);
  --p-surface2: light-dark(#f3f5f9,#1e242c);
  --p-line: light-dark(#e2e7ef,#28303a);
  --p-line2: light-dark(#eef1f6,#212831);
  --p-text: light-dark(#131922,#e7ecf3);
  --p-text2: light-dark(#5d6879,#95a1b2);
  --p-text3: light-dark(#8c97a6,#6b7686);
  --p-brand: light-dark(#2f4bd8,#8296ff);
  --p-brand-soft: light-dark(#eaefff,#1a2140);
  --p-warm: light-dark(#b9631a,#e9a457);
  --p-warm-soft: light-dark(#fdf1e3,#2a2015);
  --p-green: light-dark(#16794e,#4ecb8f);
  --p-green-soft: light-dark(#e6f6ef,#11241c);
  --p-red: light-dark(#bb3a2c,#ff8f7e);
  --p-red-soft: light-dark(#fdeae7,#2b1917);
  --p-r: 10px;
  display:block; color:var(--p-text); line-height:1.6;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#js-app *,#js-app *::before,#js-app *::after{box-sizing:border-box}
#js-app [hidden]{display:none!important}
#js-app p{margin:0}
#js-app button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
#js-app .js-window{
  background:var(--p-window);border:1px solid var(--p-line);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px light-dark(rgba(16,24,40,.05),rgba(0,0,0,.4));
}
#js-app .js-topbar{
  display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;
  background:var(--p-surface);border-bottom:1px solid var(--p-line);
}
#js-app .js-brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;white-space:nowrap}
#js-app .js-mark{
  width:22px;height:22px;border-radius:6px;background:var(--p-brand);color:light-dark(#fff,#0c1024);
  display:grid;place-items:center;font-size:11px;font-weight:500;
}
#js-app .js-topright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--p-text2);white-space:nowrap}
#js-app .js-body{display:grid;grid-template-columns:150px minmax(0,1fr)}
#js-app .js-side{
  background:var(--p-surface);border-right:1px solid var(--p-line);padding:10px 8px;
  display:flex;flex-direction:column;gap:2px;
}
#js-app .js-navitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--p-text2);width:100%}
#js-app .js-navitem:hover{background:var(--p-surface2);color:var(--p-text)}
#js-app .js-navitem[aria-current="true"]{background:var(--p-brand-soft);color:var(--p-brand);font-weight:500}
#js-app .js-navitem svg{width:15px;height:15px;flex:none;opacity:.9}
#js-app .js-sidenote{margin:auto 4px 2px;font-size:11px;color:var(--p-text3);border-top:1px solid var(--p-line2);padding-top:10px;line-height:1.6}
#js-app .js-main{padding:14px;min-width:0}
/* 对话三栏 */
#js-app .js-chatwrap{display:grid;grid-template-columns:196px minmax(0,1fr) 236px;gap:12px;align-items:start}
#js-app .js-panelx{background:var(--p-surface);border:1px solid var(--p-line);border-radius:var(--p-r);min-width:0}
#js-app .js-ptitle{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;padding:11px 13px;border-bottom:1px solid var(--p-line2)}
#js-app .js-ptitle small{margin-left:auto;font-size:11px;color:var(--p-text3);font-weight:400}
/* 专家列表 */
#js-app .js-expert{display:flex;gap:9px;align-items:flex-start;width:100%;padding:9px 11px;border-radius:8px}
#js-app .js-expert:hover{background:var(--p-surface2)}
#js-app .js-expert[aria-pressed="true"]{background:var(--p-brand-soft)}
#js-app .js-eavatar{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--p-surface2);color:var(--p-text2);font-size:12px;font-weight:500;
}

#js-app .js-ename{font-size:12.5px;font-weight:500;display:block}

/* 对话区 */
#js-app .js-conv{display:flex;flex-direction:column;min-height:520px}
#js-app .js-convhead{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--p-line2);flex-wrap:wrap}
#js-app .js-convhead b{font-size:13px;font-weight:500}
#js-app .js-convhead span{font-size:11.5px;color:var(--p-text3)}
#js-app .js-msgs{padding:14px;display:flex;flex-direction:column;gap:14px;flex:1;overflow-y:auto;max-height:min(62vh,620px)}
#js-app .js-msg{display:flex;gap:9px;align-items:flex-start}
#js-app .js-mavatar{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:500;
  background:var(--p-brand);color:light-dark(#fff,#0c1024);
}
#js-app .js-msg.me{flex-direction:row-reverse}
#js-app .js-msg.me .js-mavatar{background:var(--p-surface2);color:var(--p-text2)}
#js-app .js-bubble{
  background:var(--p-surface2);border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.75;
  max-width:min(680px,88%);white-space:pre-wrap;word-break:break-word;
}
#js-app .js-msg.me .js-bubble{background:var(--p-brand);color:light-dark(#fff,#0c1024)}
#js-app .js-status{font-size:11.5px;color:var(--p-text3);padding:2px 0 0 35px}
#js-app .js-dots::after{content:'…';animation:jndots 1.4s steps(4,end) infinite}
@keyframes jndots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
/* 开场 */
#js-app .js-hello{padding:6px 14px 0}
#js-app .js-hello .js-bubble{max-width:100%;background:var(--p-surface2)}
#js-app .js-starters{display:flex;flex-direction:column;gap:7px;margin-top:12px}
#js-app .js-starter{
  border:1px solid var(--p-line);border-radius:9px;padding:9px 12px;font-size:12.5px;color:var(--p-text2);
  background:var(--p-surface);width:100%;
}
#js-app .js-starter:hover{border-color:var(--p-brand);color:var(--p-brand)}
#js-app .js-starter::before{content:'▸ ';opacity:.55}
/* 输入 */
#js-app .js-composer{border-top:1px solid var(--p-line2);padding:11px 14px;display:flex;gap:9px;align-items:flex-end}
#js-app .js-composer textarea{
  flex:1;min-width:0;min-height:44px;max-height:150px;resize:vertical;font:inherit;font-size:13px;line-height:1.6;
  color:var(--p-text);background:var(--p-surface2);border:1px solid var(--p-line);border-radius:9px;padding:10px 12px;outline:none;
}
#js-app .js-composer textarea:focus{border-color:var(--p-brand)}
#js-app textarea::placeholder{color:var(--p-text3)}
#js-app .js-btn{border:1px solid var(--p-line);border-radius:9px;padding:9px 15px;font-size:12.5px;background:var(--p-surface2);color:var(--p-text2)}
#js-app .js-btn:hover{border-color:var(--p-brand);color:var(--p-brand)}
#js-app .js-btn.primary{background:var(--p-brand);border-color:var(--p-brand);color:light-dark(#fff,#0c1024);font-weight:500}
#js-app .js-btn:disabled{opacity:.5;cursor:not-allowed}
/* 引用 */
#js-app .js-refs{padding:0}
#js-app .js-refbody{padding:11px 13px;display:flex;flex-direction:column;gap:9px}
#js-app .js-ref{border-left:2px solid var(--p-brand);padding-left:9px}
#js-app .js-ref b{font-size:11.5px;font-weight:500;display:block;line-height:1.5}
#js-app .js-ref span{font-size:10.5px;color:var(--p-text3);display:block;margin-top:2px}
#js-app .js-ref p{font-size:11px;color:var(--p-text3);margin-top:4px;line-height:1.6}
#js-app .js-empty{font-size:11.5px;color:var(--p-text3);padding:4px 0;line-height:1.7}
#js-app .js-err{font-size:12px;color:var(--p-red);background:var(--p-red-soft);border-radius:8px;padding:9px 12px;line-height:1.6}
#js-app .js-hint{font-size:11px;color:var(--p-text3);padding:8px 14px;border-top:1px solid var(--p-line2)}
/* 知识库 / 合规 / 画像 复用旧样式 */
#js-app .js-search{display:flex;gap:8px;align-items:center;border:1px solid var(--p-line);border-radius:9px;padding:8px 12px;background:var(--p-surface2);font-size:12.5px;color:var(--p-text3);margin-bottom:10px}
#js-app .js-search input{border:0;background:none;outline:none;font:inherit;color:var(--p-text);flex:1;min-width:0}
#js-app .js-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#js-app .js-chip{border:1px solid var(--p-line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--p-text2);background:var(--p-surface2)}
#js-app .js-chip:hover{border-color:var(--p-brand);color:var(--p-brand)}
#js-app .js-chip[aria-pressed="true"]{background:var(--p-brand);border-color:var(--p-brand);color:light-dark(#fff,#0c1024)}
#js-app .js-lib{display:flex;flex-direction:column;gap:7px}
#js-app .js-doc{display:flex;gap:11px;align-items:center;border:1px solid var(--p-line);border-radius:9px;padding:9px 12px;background:var(--p-surface);font-size:12.5px;width:100%}
#js-app .js-doc:hover{border-color:var(--p-brand)}
#js-app .js-doc em{font-style:normal;margin-left:auto;font-size:11px;color:var(--p-text3);white-space:nowrap}
#js-app .js-tag{display:inline-flex;align-items:center;font-size:11px;border-radius:5px;padding:1px 7px;background:var(--p-surface2);color:var(--p-text2);border:1px solid var(--p-line);white-space:nowrap}
#js-app .js-tag.b{background:var(--p-brand-soft);color:var(--p-brand);border-color:light-dark(#d6defb,#242c52)}
#js-app .js-ta{width:100%;min-height:140px;font:inherit;font-size:12.5px;line-height:1.7;color:var(--p-text);background:var(--p-surface2);border:1px solid var(--p-line);border-radius:9px;padding:11px 13px;outline:none;resize:vertical}
#js-app .js-bench{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:12px;padding:7px 0;border-bottom:1px solid var(--p-line2)}
#js-app .js-bench:last-child{border-bottom:0}
#js-app .js-bench b{font-weight:500;color:var(--p-red);white-space:nowrap}
#js-app .js-field{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--p-line2)}
#js-app .js-field:last-of-type{border-bottom:0}
#js-app .js-field label{font-size:11.5px;color:var(--p-text3)}
#js-app .js-field input{font:inherit;font-size:12.5px;color:var(--p-text);background:var(--p-surface2);border:1px solid var(--p-line);border-radius:7px;padding:6px 10px;width:100%;min-width:0;outline:none}
#js-app .js-field input:focus{border-color:var(--p-brand)}
#js-app .js-field input::placeholder{color:var(--p-text3)}
#js-app .js-scene{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--p-text2)}
#js-app .js-scene:hover{background:var(--p-surface2)}
#js-app .js-scene[aria-pressed="true"]{background:var(--p-brand-soft);color:var(--p-brand);font-weight:500}
#js-app .js-scene span{margin-left:auto;font-size:10.5px;color:var(--p-text3)}
#js-app .js-cast{display:flex;gap:10px;align-items:flex-start;border-radius:var(--p-r);padding:11px 14px;background:var(--p-brand-soft);border:1px solid light-dark(#d6defb,#242c52);margin-bottom:12px}
#js-app .js-cast p{font-size:12.5px}
#js-app .js-bar{height:5px;border-radius:3px;background:var(--p-line);overflow:hidden}
#js-app .js-bar i{display:block;height:100%;background:var(--p-brand);border-radius:3px}
#js-app .js-lead{font-size:11.5px;color:var(--p-text2);line-height:1.75}
#js-app .js-loading{font-size:12px;color:var(--p-text3);padding:12px 0;text-align:center}
@media (max-width:1080px){
  #js-app .js-chatwrap{grid-template-columns:1fr}
  #js-app .js-msgs{max-height:none}
}
@media (max-width:820px){
  #js-app .js-body{grid-template-columns:1fr}
  #js-app .js-side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--p-line)}
  #js-app .js-navitem{width:auto}
  #js-app .js-sidenote{display:none}
}
</style>
<div class="js-window">

          <textarea class="js-ta" id="cs-text" placeholder="把要发朋友圈、发群、印在海报上的文案贴进来。例如：我们是烟台最大的美术教育机构……"></textarea>

    </main>
  </div>
</div>

<script>
(function () {
  var b = document.getElementById('jn-toggle');
  if (!b) return;
  b.addEventListener('click', function () {
    var cur = document.documentElement.style.colorScheme;
    if (!cur) { cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.style.colorScheme = cur === 'dark' ? 'light' : 'dark';
  });
})();
</script>
</body>
