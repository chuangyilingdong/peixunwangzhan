<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>作品预览</title>
  <style>html,body{margin:0;height:100%;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<!--
  学生代码的运行外壳。
  为什么需要它：主站 CSP 是 script-src 'self'，而 srcdoc/blob 文档会继承父页 CSP，
  学生代码里的内联脚本会被直接拦掉。这里用一张独立静态页（nginx 单独给它宽松 CSP）
  承载学生页面，再把学生代码 postMessage 进来写进内层 sandbox iframe，脚本就能跑。
  外壳本身不含任何业务数据，只做转发；内层 iframe 不带 allow-same-origin，学生代码碰不到主站。
-->
<iframe id="stage" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="学生作品"></iframe>
<script>
  (function () {
    var stage = document.getElementById('stage');
    window.addEventListener('message', function (event) {
      var payload = event.data;
      if (!payload || typeof payload !== 'object') return;
      // 学生页面里的 console 桥是发给本外壳的，这里转交给主站控制台面板
      if (payload.source === 'vibecoding-console') {
        try { parent.postMessage(payload, '*'); } catch (error) { /* 忽略 */ }
        return;
      }
      // 学生页面自报的高度（见 vibecodingProject.js 的 PREVIEW_HEIGHT_BRIDGE）：同样原样转发，
      // 主站拿它把预览框长到内容那么高 —— 内层就不会出现滚动条了（2026-09-27）。
      if (payload.source === 'vibecoding-preview-height') {
        try { parent.postMessage(payload, '*'); } catch (error) { /* 忽略 */ }
        return;
      }
      // PDF 桥（2026-10-02，见 vibecodingProject.js 的 PDF_BRIDGE）：学生文档截下 blob PDF 后把
      // 字节发到这里，壳**只做转发** —— 真正的渲染在平台应用里做（它自带 pdf.js、且不在沙箱里）。
      // 回程由应用发给壳、壳转进 stage（学生那种写法因此不用改一行代码就能显示）。
      if (payload.source === 'vibecoding-pdf-render') {
        try { parent.postMessage(payload, '*'); } catch (error) { /* 忽略 */ }
        return;
      }
      // ⚠️ 回程也要接上（第一版漏了这条：请求上去了、结果回不来，学生侧永远停在"正在渲染…"）：
      // 应用把渲染好的图片发给壳，壳转进 stage，学生文档里的桥把 `<img>` 贴进那个 iframe。
      if (payload.source === 'vibecoding-pdf-rendered') {
        try { stage.contentWindow.postMessage(payload, '*'); } catch (error) { /* 忽略 */ }
        return;
      }
      // 素材 fetch 桥（2026-10-03，见 vibecodingProject.js 的 ASSET_FETCH_BRIDGE）：学生页 fetch 文档字节
      // （docx/pptx 这种页面自己解析的）在沙箱里既禁网、又过不了 CORS（opaque origin ⇒ Origin: null，
      // 我们的 OSS 不给它 ACAO，生产实测原话见那处注释）—— 所以请求转上去、应用取到字节再按同一条回程送回来。
      // 四条腿与 PDF 桥同款（上行/下行各一条），别只写一半。
      if (payload.source === 'vibecoding-asset-fetch') {
        try { parent.postMessage(payload, '*'); } catch (error) { /* 忽略 */ }
        return;
      }
      if (payload.source === 'vibecoding-asset-fetched') {
        try { stage.contentWindow.postMessage(payload, '*'); } catch (error) { /* 忽略 */ }
        return;
      }
      if (payload.source === 'vibecoding-preview' && typeof payload.html === 'string') {
        stage.srcdoc = payload.html;
      }
    });
    parent.postMessage({ source: 'vibecoding-preview-ready' }, '*');
  })();
</script>
</body>
</html>
