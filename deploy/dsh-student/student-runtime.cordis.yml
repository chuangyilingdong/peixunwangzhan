# 平台「学生运行时」补丁层
# 用法：dsh --profile web --patch /etc/dsh/student-runtime.cordis.yml
# 作用：把官方 web 组合改成「孩子用的一次性创作环境」——模型走我们自己的网关、
#      关掉能自造插件挂进宿主的那两个 runner、关掉插件管理/目录选择等成人入口、
#      把写权限限制在一次性的 workspace 里，并且不弹「等你点同意」的审批。

# 审批：没有真人坐在旁边点同意，所以不弹审批。
# 官方语义（docs/subsystems/approval.md）：'never' = every ask resolves 'rejected'（**直接拒绝**，不是自动放行）；
# 'ask' 在没有应答者时是 'unavailable'，调用方同样 fail-closed。
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: 'never'

# 权限预设：沙箱模式必须和审批策略配成同一个预设，否则组合期直接报错
# 「composed sandbox and approval defaults match no preset」。这里把三档都改成不弹审批，
# 并把 defaultPreset 显式指到 workspace-write。
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: never
      workspace-write:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# 沙箱：只在这一次性的工作区里可写（容器是外层边界，这里是内层策略）。
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: 'workspace-write'
    workspaceRoot: !!js process.env.DSH_WORKSPACE

# 模型路由：只用我们自己的网关（OpenAI 兼容），不直连 DeepSeek 官方。
# apiKeyEnv 是凭据引用，密钥不进配置文件；baseURL 由容器环境注入。
#
# ⚠️ 这里的模型 id 只是**给学生看的槽位名**，不是上游的真名：学生选了哪个名字，由我们网关
# 在**自己渠道的模型清单**里解析（认得出就用它，认不出就用那条渠道的默认模型），
# 见 apps/server/src/routes/runtimeGateway.js 的 resolveRuntimeSelection 与守卫 scripts/p97。
# 也就是说：改这里不影响计费，改渠道配置才影响。
#
# `input: [text, image]` **不能省**：dsh 的 pi-ai 适配器对**手写声明的模型**默认只认文本
# （官方原文：Declaring images is what makes a hand-declared vision model usable）。
# 不声明的话，学生贴进来的图根本不会进请求体 —— 而我们的模型（deepseek-flash 那条渠道）
# 本来就能看图（平台老 VibeCoding 的聊天一直就是这么发的，实测能读图里的颜色）。
# 声明之后：图当**内容块**走同一条 TEXT 渠道、同一个模型，费用照常进我们的算力账。
# （另配了「读图渠道」才改走那条，见后台计费配置的「读图渠道」。）
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      platform-gateway:
        displayName: 平台网关
        apiKeyEnv: PLATFORM_GATEWAY_KEY
        api: openai-completions
        baseURL: !!js process.env.PLATFORM_GATEWAY_BASE_URL
        # —— 每次请求的图片总预算（2026-09-17，**这是「历史无限增长」的正解**）——
        # 历史里的**每一张图都会被重新编进每一次请求体**（dsh 自己的注释原话），所以对话越长
        # 请求体越大，最后必然撞上上游/网关的请求体积上限 —— 而**压缩救不了它**：压缩的触发按
        # token 算，可图片在 dsh 的计量里只是一个附件引用（正文到发请求时才编码），
        # 于是「字节的墙」总是先到，压缩永远来不及（这就是「没有尽头」的机制）。
        #
        # 这个开关就是 dsh 为「部署在更严格的网关后面」留的：超预算时它把**最老的**几张图
        # 从这一次请求里**省略**，换成一行 `[image omitted to fit request image limits; …]`
        # （函数名 replaceOldestImages —— 保留最新的，所以 agent 刚读过的图一定看得见）。
        # 历史本身不动，界面上那些图还在；省掉的只是每次重发与重复计费。
        #
        # 取值：默认 20MiB 是给「请求上限很宽的供应商」的，对我们网关太贴近了（20MiB 图 + 正文 ≈ 21MB，
        # 而我们的请求体上限是 24MB，一次抖动就撞墙）。取 8MiB ≈ 30 张我们的截图（185-288KB 一张），
        # 而一轮「看自己的产物」通常只读 4-12 张 —— **预算必须明显大于一轮工作集**：
        # 设小了 agent 会为了看被省略的图反复重读（实测 1MiB 时 8 张图的活跑了 59 次调用还没做完）。
        # 请求体因此被钉在 ~8.5MB，且不随会话变长而增长。
        maxRequestImageBytes: 8388608
        models:
          - id: deepseek-flash
            name: 平台网关 · DeepSeek Flash
            input: [text, image]
          - id: deepseek-pro
            name: 平台网关 · DeepSeek Pro
            input: [text, image]

# —— 学生端的三个功能：对话 / 写代码 / 做网页（2026-09-17）——
# 用 dsh **原生的 preset 机制**：一个 preset = 一个目录（agent.cordis.yml 定义它自己的提示词/工具/技能，
# preset.yml 给选择器显示的名字与描述）。dsh 自带的选择器（输入框那一排的「标准模式 ⌄」）会列出来，
# 学生在那儿切换即可 —— 所以这条不需要任何自写插件。
# ⚠️ dsh 的规矩：**只有空会话能切 preset**（已经聊过就固定了）。要「随时可切」得另想办法。
# ⚠️ 为什么不用自写插件：实测这个部署里 `link:` 进 profile 的包**只有客户端半边会下发，
#    宿主半边不被加载**（连品牌包的 apply 都没跑过），所以宿主插件这条路暂时走不通（见交接文档）。
# 预设目录由 provision-user-runtime.sh 从官方 preset 复制而来（改 persona 段），装在 /opt/dsh-runtime/etc/dsh/agent-presets。
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: chat
    roots:
      - path: /opt/dsh-runtime/etc/dsh/agent-presets
        trust: user

# —— 默认模型与官方路由：必须只用我们自己的网关 ——
# dsh 出厂的默认模型是它自带的 `deepseek-official` 渠道（catalog 路由），容器里没有那个 key：
# 学生一发消息就是 MISSING_CREDENTIAL（实测：界面显示 DeepSeek-V41-Flash，然后整轮失败）。
# 所以这里把默认模型指到我们网关的槽位，并把官方那条路由**关掉** ——
# 学生也就不会在模型选择器里挑到一个必然失败的模型。
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: platform-gateway
    model: deepseek-flash
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

# 课程技能：我们自己的技能根目录（把课程要求写成 SKILL.md）。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js process.env.DSH_COURSE_SKILLS

# —— 以下四行是「给学生用必须关掉」的成人入口 ——
# cordis-*-runner 让模型自己写 JS 并以临时插件挂进宿主，官方注释写明在 Web 面上
# 沙箱与审批两道都会被绕过；插件管理和目录选择则是给孩子看的多余且危险的面。
- id: cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'
  disabled: true
- id: cordis-client-runner
  name: '@deepseek-ai/dsh-cordis-client-runner'
  disabled: true
# 只关 host 侧 runner 会让 web 起不来：客户端面板 ui-cordis 在等 dynamicCordisRunner 这个服务，
# 结果整页显示「Failed to load plugins」（实测踩到）。两边必须一起关。
- id: ui-cordis
  name: '@deepseek-ai/dsh-client-ui-cordis'
  disabled: true
- id: plugin-inventory
  name: '@deepseek-ai/dsh-host-plugin-inventory'
  disabled: true
# ⚠️ 目录选择器**必须留着**：dsh 的 web 界面在「选好工作区」之前不允许发消息，
# 把它关掉的结果是输入框一直是灰的（实测）。学生选自己容器里的 /home/student/workspace 即可。
- id: open-in-app
  name: '@deepseek-ai/dsh-host-open-in-app'
  disabled: true

# —— 第三方插件里与当前 dsh 版本不兼容的那些 ——
# dsh-at-file 要 `@deepseek-ai/dsh-settings` 的 `settingsNamespace` 导出，而我们钉的 dsh 0.1.5-rc.1
# 里没有这个导出（它面向更新的 harness；npm 上 dsh 最新也还是 0.1.5-rc.1，插件只有 0.6.3 一个版本）。
# 包仍然装在 profile 里，只是不挂载；等 dsh 升级到插件要求的版本再打开这一行。
# 实测：只要挂上它，整棵插件树加载失败、界面直接起不来。
- id: dsh-at-file
  name: dsh-at-file
  disabled: true

# —— 第三方插件（主要是 @linxin666/dsh-web-all）带进来的成人入口：给学生全部关掉 ——
# 关的是**行**不是包：包还在 profile 里，等以后需要再打开。
- {id: web-ui-plugin-manager, name: '@linxin666/dsh-web-all/plugin-manager', disabled: true}
- {id: web-ui-market, name: '@linxin666/dsh-web-all/market', disabled: true}
- {id: web-ui-community-plugins, name: '@linxin666/dsh-web-all/community-plugins', disabled: true}
- {id: web-ui-remote-web-ui, name: '@linxin666/dsh-web-all/remote-web-ui', disabled: true}
- {id: web-ui-doctor, name: '@linxin666/dsh-web-all/doctor', disabled: true}
- {id: web-ui-task-board, name: '@linxin666/dsh-web-all/task-board', disabled: true}
- {id: web-ui-git-graph, name: '@linxin666/dsh-web-all/git-graph', disabled: true}
- {id: web-ui-pet, name: '@linxin666/dsh-web-all/pet', disabled: true}
- {id: web-ui-skin-center, name: '@linxin666/dsh-web-all/skin-center', disabled: true}
- {id: web-ui-session-archive, name: '@linxin666/dsh-web-all/session-archive', disabled: true}
- {id: web-ui-usage, name: '@linxin666/dsh-web-all/usage', disabled: true}
- {id: web-ui-model-capabilities, name: '@linxin666/dsh-web-all/model-capabilities', disabled: true}
- {id: web-ui-describe-image, name: '@linxin666/dsh-web-all/describe-image', disabled: true}
- {id: ui-settings-plugin-inventory, name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory', disabled: true}

# —— 品牌：把官方那个鲸鱼标与「DeepSeek Harness」字标换成灵动ai（见 brand-plugin/ 与 rebrand.mjs）——
# 关掉官方品牌行（它的两个插槽占用者），由我们自己的品牌包顶上；字符串与 favicon 在构建期替换。
- {id: ui-brand-official, name: '@deepseek-ai/dsh-client-ui-brand-official', disabled: true}
