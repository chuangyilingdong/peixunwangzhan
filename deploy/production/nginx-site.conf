# AI 少儿编程平台｜生产单域名配置（**这份是生产上实际在跑的那一份**）
# 生产 API 仅监听 127.0.0.1:8789；80 强制跳转 HTTPS。
#
# ⚠️ 安装时把 __SITE_DOMAIN__ 全部替换成真实域名，例如：
#     sed 's/__SITE_DOMAIN__/iicili.cyou/g' nginx-site.conf > /etc/nginx/sites-enabled/iicili.cyou
#
# ⚠️ 与 deploy/production/nginx.conf.example 的关系：**example 已经过期**（缺 /downloads/ 与
#    /media/ 两个 location、client_max_body_size 还是 26m）。以本文件为准；换机器时搬的是本文件，
#    不是 example。2026-09-23 迁移前把生产上那份逐字抄了回来。
#
# ⚠️ 本文件之外还有两处**服务器级前置**（不在本文件里，漏了会静默失效，见
#    migrate/01-prepare-new-host.sh 会一并处理）：
#   ① /etc/nginx/mime.types 的 application/javascript 必须带 mjs（否则 .mjs 回落成
#      octet-stream，配上 nosniff 浏览器直接拒收 —— pdf.js worker 会报
#      "Failed to fetch dynamically imported module"，而文件其实是 200）。
#   ② /etc/nginx/nginx.conf 里要有 `include /etc/nginx/dsh-students/*.conf;`
#      （学生每个入口一条 server 块；漏了 → 学生端所有端口都不通）。

server {
    listen 80;
    listen [::]:80;
    server_name __SITE_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SITE_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__SITE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SITE_DOMAIN__/privkey.pem;

    server_tokens off;
    # ⚠️ 300m 不是随手写的：课件/素材上传走这里。example 里的 26m 会让大课件被 nginx 先挡掉
    # （应用侧 FILE_UPLOAD_MAX_BYTES 是 25MB，历史上为了课件上传放宽到 300m）。
    client_max_body_size 300m;

    # 静态资源压缩（2026-09-25）。nginx 默认**只压 text/html** —— 也就是 JS/CSS/JSON 一直不压，
    # 而广场「网页作品」里的 `three.module.js` 单个文件就 1.2MB：两天实测从这台机出去了 79MB 的 .js
    # （占 /media 出口三分之一），压完大约剩四分之一。为什么写在这里而不是服务器级 nginx.conf：
    # 那样它就出了仓库，换机器/重装就丢了。gzip 允许出现在 server 块里，本站点的 location 全部继承。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ⚠️ `connect-src` 里的 OSS 域是**必需的、别删**（2026-09-25 生产实测的成因）：
    #    素材在 OSS 上时 `/api/**/download` 会 302 到那个桶的签名地址，前端要 `fetch` 回来转成
    #    blob: 才不依赖 cookie。原来只有 'self' → 跨域 fetch 一律 `TypeError: Failed to fetch`
    #    → 前端只能退回 `<img src="/api/...">`，而子资源请求**只带 cookie、带不了 Authorization**：
    #    同一个浏览器里后台/机构端登录把 cookie 顶掉之后，学生画布上所有素材 403、整屏图裂。
    #    域跟着 `OSS_REGION` 走 —— 换 OSS 地域时这里要一起改。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.oss-cn-guangzhou.aliyuncs.com" always;

    # Common scanner targets must not fall back to SPA HTML with HTTP 200.
    # Exact and prefix locations win before the SPA regex fallback behavior used by try_files.
    location = /.env { return 404; }
    location ^~ /.env { return 404; }
    location ^~ /.git { return 404; }
    location ^~ /.aws { return 404; }
    location ^~ /.ssh { return 404; }
    location ^~ /.svn { return 404; }
    location = /.DS_Store { return 404; }
    location = /config.json { return 404; }
    location = /backup.sql { return 404; }
    location = /dump.sql { return 404; }
    location = /wp-login.php { return 404; }
    location = /xmlrpc.php { return 404; }
    location ^~ /phpmyadmin { return 404; }
    location ^~ /actuator { return 404; }

    # BEGIN AI-KIDS-SENSITIVE-PATH-HARDENING
    # Do not let repository/runtime paths fall through to SPA index.html.
    location = /server.js { return 404; }
    location = /package.json { return 404; }
    location = /pnpm-lock.yaml { return 404; }
    location = /pnpm-workspace.yaml { return 404; }
    location ^~ /apps/ { return 404; }
    location ^~ /packages/ { return 404; }
    location ^~ /node_modules/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /deploy/ { return 404; }
    # END AI-KIDS-SENSITIVE-PATH-HARDENING

    # 客户端安装包与广场媒体（2026-09-23 起）：**由应用决定从哪发** ——
    # 应用对 OSS 上有的对象 **302 到签名地址**（字节由 OSS 直接服务，不占这台机 5 Mbps 出口），
    # 对 OSS 上没有的对象用 **X-Accel-Redirect** 交回下面那两个 internal location 发本地文件
    # （兜底路径；Range 与视频拖拽由 nginx 原生处理，不用应用搬字节）。
    # ⚠️ 两条永远走本地，别改：
    #    · /downloads/manifest.json —— 客户端更新清单必须"刚发布就读到新的"
    #    · /media/web-works/*        —— 那些页面在 null origin 的沙箱 iframe 里按 **CORS 模式**
    #      import ES module，而 OSS 不返回 Access-Control-Allow-Origin（除非给 bucket 配 CORS）
    location ^~ /downloads/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # X-Accel-Redirect 的落点：**只给应用内部跳转用**，从外面直接访问一律 404。
    location /__local_media/ {
        internal;
        alias /srv/ai-kids-platform/public-media/;
        autoindex off;
        # ⭐ CORS 必须留着：media/web-works/* 的 ES module 是在**不带 allow-same-origin 的沙箱
        #    iframe** 里按 CORS 模式取的，缺这个头整片白屏（2026-09-19 线上踩过）。
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 30d;
    }

    location /__local_downloads/ {
        internal;
        alias /srv/ai-kids-platform/downloads/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type application/octet-stream;
        # 安装包本体：文件名带版本、内容永不改 → 缓存一天正合适。
        expires 1d;
    }

    # 客户端更新清单：**必须每次读最新的**（发完新版立刻生效）。
    # ⚠️ 它落在 /__local_downloads/ 下面，所以**必须**单独写一条更精确的 location ——
    #    实测过不写这条时它跟着父块带上 `Cache-Control: max-age=86400`：
    #    服务器明明发的是新清单，浏览器/代理/CDN 任一层照着缓存，就会出现
    #    「平台说发了新版、客户端一整天看不到」（客户端自己带 ?t=、官网 fetch 带 no-store 才绕过去）。
    #    2026-09-28 客户端团队对 Mac 发布提要求时专门点了这条。
    location = /__local_downloads/manifest.json {
        internal;
        alias /srv/ai-kids-platform/downloads/manifest.json;
        default_type application/json;
        # no-cache = 每次都回源校验（文件带 Last-Modified/ETag，没变就是 304，不浪费带宽）
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api { return 301 /api/; }
    location = /api/health {
        proxy_pass http://127.0.0.1:8789/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # ⭐ 客户端安装包上传（2026-09-25，后台「上传并发布」）——**必须单独一条**：
    #   · 现网包 377MB，站点级 `client_max_body_size 300m` 会先把它挡成 413（包根本没到应用）；
    #   · `proxy_request_buffering off` 是关键：开着的话 nginx 会先把整包**写到 /var/lib/nginx** 再转发，
    #     白白多写 377MB；关掉才是边读边转发（应用那边也是流式落盘，见 clientInstallerUpload.js）；
    #   · 上传十分钟起步（5 Mbps 公网出口），读/写超时都要放宽，否则传到一半被 nginx 掐断。
    # ⚠️ 精确匹配（`= `）优先于下面那些正则与前缀 location，不会被 `/api/` 或 `/api/**preview$` 抢走。
    location = /api/admin/client-update/upload {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        client_max_body_size 800m;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        # SSE 流式对话：思考阶段可能几十秒无数据，放宽读超时并关闭缓冲
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 学生环境里的 agent 走我们网关调模型（SSE 流式）。历史一长要小心：一次任务几十轮工具调用后
    # 上下文很大，上游出第一个 token 可能要等很久，而 location /api/ 是 nginx 默认 60s 读超时 ——
    # 超时会让 nginx 直接 504，**请求根本没到应用**（账本里连一条失败记录都没有），
    # 学生看到「AI 供应商调用失败 / PI_AI_ERROR」。2026-09-16 实测（跑完一串 Bash 后死在末尾）。
    location ~ ^/api/gateway/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 开创作环境（VibeCoding）是**同步等**宿主把学生环境起起来：平台侧超时 90s，
    # 宿主脚本自己还会等 dsh 打印 token（最长 ~60s）。而 location /api/ 没写 proxy_read_timeout
    # ＝ nginx 默认 **60s** —— 慢一点的学生会先被 nginx 掐成 504，前端显示「服务暂时不可用」。
    # 2026-09-16 单独给这条路径放宽；正则 location 优先级高于前缀 /api/。
    location ~ ^/api/student/runtime/(launch|stop)$ {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 在线预览类响应允许同源内嵌（2026-09-16）：课件与作品里的 PPT/PDF 是在我们自己
    # 的页面里 iframe 打开的，站点级 DENY 会把它们全挡掉。只放行以 /preview 结尾的路径。
    # ⚠️ add_header 子层级覆盖父层级：CSP 必须一起重写，否则 frame-ancestors none 仍然挡。
    location ~ ^/api/(?:org|public|student|admin)/.*preview$ {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 学生作品预览外壳：srcdoc 会继承主站 CSP（script-src self）导致学生内联脚本被拦，
    # 这张静态页只做转发，单独放宽 CSP；学生代码跑在内层 sandbox iframe 里。
    location = /vibe-preview.html {
        root /srv/ai-kids-platform/production/current/apps/website;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' https:; style-src 'unsafe-inline' https:; img-src 'self' data: https:; font-src data: https:; media-src data: https: blob:; connect-src https: wss:; frame-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ⭐ 2026-10-02：SPA 入口文档一律 no-cache（index.html 一变就得让所有打开着的页面拿到新包；
    #    带哈希的 /assets/ 仍长缓存）。此前 /org/ 与 /admin/ 的 index.html 没有任何缓存头，
    #    浏览器按启发式缓存，用户的标签页能一连好几天跑旧包（旧包没有分享、没有素材直链改写）。
    location = /admin/index.html {
        root /srv/ai-kids-platform/production/current/apps;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /org/index.html {
        root /srv/ai-kids-platform/production/current/apps;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /index.html {
        root /srv/ai-kids-platform/production/current/apps/website;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /admin { return 301 /admin/; }
    location /admin/ {
        root /srv/ai-kids-platform/production/current/apps;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /org { return 301 /org/; }
    location /org/ {
        root /srv/ai-kids-platform/production/current/apps;
        try_files $uri $uri/ /org/index.html;
    }

    # 官网的静态素材（构建产物 + 视频/图片/字体）：**加长缓存**（2026-09-26，用户口径「保证官网的流畅度」）。
    # 原来一条 cache-control 都没有 → 每次访问、每个素材都要回源做一次 304 往返；
    # 首屏那支视频 0.9MB、字体 490KB，回访者每次都要重新校验一遍。
    # ⚠️ 用 `expires` 而不是 `add_header Cache-Control`：add_header 会**顶掉**站点级那批安全头
    #    （CSP / nosniff / HSTS …，见本文件里 CSP 那段注释），expires 只加 Cache-Control + Expires。
    # ⚠️ 手工素材（视频/图片/logo）**换了要改名**，否则回访者最多 7 天看不到新的 ——
    #    2026-09-26 换视频就是改名（hero-animal.mp4 → hero-rabbit.mp4）。
    location ^~ /assets/ {
        root /srv/ai-kids-platform/production/current/apps/website;
        expires 7d;
        access_log off;
    }

    location / {
        root /srv/ai-kids-platform/production/current/apps/website;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
