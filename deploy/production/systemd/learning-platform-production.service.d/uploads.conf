[Service]
# 主单元里的 ReadWritePaths 只写了 data/logs，**没写 uploads** —— 而单元开了
# ProtectSystem=strict，于是在这个 drop-in 缺失的机器上，上传会直接写不进去
# （症状：上传接口报错，日志里是 EACCES / 只读文件系统）。
# 换机器时这个文件必须跟主单元一起装。
#
# ⚠️ 2026-09-27 同一个坑踩了第二遍：**客户端安装包目录 /srv/ai-kids-platform/downloads 当时不在这一行里**。
#    后台「客户端更新 → 上传并发布」要把包写到那，清单（manifest.json）也在同一个目录 ——
#    实测（用服务同一套沙箱往那写）= **READONLY**，也就是说**这条后台上传路在生产上一直写不进去**。
#    所以线上那两个包一直是 root 用 scp 放上去的（属主 root 就是证据），也就**从来没走过推 OSS** →
#    537MB 的 DMG 得从这台机 5 Mbps 出口发。加进这一行之后后台上传才真能用。
# ⚠️ 以后再加「服务要写」的目录，**必须同时**加进这一行；03 自检里有一条静态检查盯着 downloads 在不在。
ReadWritePaths=/srv/ai-kids-platform/production/data /srv/ai-kids-platform/production/logs /srv/ai-kids-platform/production/uploads /srv/ai-kids-platform/downloads
