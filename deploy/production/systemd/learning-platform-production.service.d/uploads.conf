[Service]
# 主单元里的 ReadWritePaths 只写了 data/logs，**没写 uploads** —— 而单元开了
# ProtectSystem=strict，于是在这个 drop-in 缺失的机器上，上传会直接写不进去
# （症状：上传接口报错，日志里是 EACCES / 只读文件系统）。
# 换机器时这个文件必须跟主单元一起装。
ReadWritePaths=/srv/ai-kids-platform/production/data /srv/ai-kids-platform/production/logs /srv/ai-kids-platform/production/uploads
