<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
<title>登录 · 灵动ai创作客户端</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff;
    font: 14px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  .aura { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 12% 18%, rgba(255,92,147,.16), transparent 45%),
                radial-gradient(circle at 88% 82%, rgba(255,92,147,.10), transparent 42%); }
  main { position: relative; width: min(420px, calc(100vw - 48px)); padding: 38px 34px 30px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; background: rgba(255,255,255,.04); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .brand i { width: 12px; height: 12px; border-radius: 50%; background: #ff5c93; }
  h1 { margin: 18px 0 6px; font-size: 24px; letter-spacing: -.02em; }
  p.lead { margin: 0 0 22px; color: rgba(255,255,255,.55); font-size: 13px; }
  label { display: block; margin-bottom: 14px; color: rgba(255,255,255,.72); font-size: 12.5px; font-weight: 700; }
  input { width: 100%; margin-top: 7px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.16); border-radius: 12px;
    background: rgba(255,255,255,.06); color: #fff; font: inherit; outline: none; }
  input:focus { border-color: rgba(255,92,147,.6); }
  button { width: 100%; margin-top: 8px; padding: 13px; border: 0; border-radius: 12px; background: #ff5c93; color: #fff;
    font: inherit; font-weight: 800; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .error { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: rgba(255,92,147,.12);
    color: #ffb3cd; font-size: 12.5px; }
  .error[hidden] { display: none; }
  .foot { margin-top: 18px; color: rgba(255,255,255,.35); font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
<div class="aura"></div>
<main>
  <div class="brand"><i></i>灵动ai创作客户端</div>
  <h1>学生登录</h1>
  <p class="lead">用你的学生账号登录；老师开始上课后就能进入课堂。</p>
  <p class="error" id="error" hidden></p>
  <form id="form">
    <label>账号<input id="login" autocomplete="username" autofocus /></label>
    <label>密码<input id="password" type="password" autocomplete="current-password" /></label>
    <button id="submit" type="submit">登录</button>
  </form>
  <div class="foot">登录信息只保存在这台电脑上</div>
</main>
<script>
  const error = document.getElementById('error')
  const form = document.getElementById('form')
  const submit = document.getElementById('submit')
  window.__lingdongRender = () => {
    const state = window.__LINGDONG_STATE__ || {}
    if (state.message) { error.textContent = String(state.message); error.hidden = false }
  }
  window.__lingdongRender()
  form.addEventListener('submit', async (event) => {
    event.preventDefault()
    error.hidden = true
    submit.disabled = true
    submit.textContent = '登录中…'
    const result = await window.lingdong.gate({
      action: 'login',
      login: document.getElementById('login').value,
      password: document.getElementById('password').value,
    })
    if (!result || result.ok !== true) {
      error.textContent = (result && result.message) || '登录失败，请重试'
      error.hidden = false
      submit.disabled = false
      submit.textContent = '登录'
    }
  })
</script>
</body>
</html>
