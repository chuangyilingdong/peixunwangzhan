<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
<title>等老师开始上课 · 灵动ai创作客户端</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff;
    font: 14px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  .aura { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 16% 22%, rgba(255,92,147,.14), transparent 46%),
                radial-gradient(circle at 84% 78%, rgba(255,92,147,.09), transparent 42%); }
  main { position: relative; width: min(460px, calc(100vw - 48px)); padding: 40px 36px 30px; text-align: center;
    border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: rgba(255,255,255,.04); }
  .dot { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,92,147,.14); color: #ff5c93; font-size: 24px; }
  h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 0 0 8px; color: rgba(255,255,255,.58); font-size: 13.5px; }
  .name { color: #fff; font-weight: 800; }
  .row { display: flex; gap: 12px; margin-top: 26px; }
  button { flex: 1; padding: 13px; border: 0; border-radius: 12px; font: inherit; font-weight: 800; cursor: pointer; }
  .primary { background: #ff5c93; color: #fff; }
  .ghost { background: rgba(255,255,255,.08); color: rgba(255,255,255,.8); }
  .tip { margin-top: 20px; color: rgba(255,255,255,.32); font-size: 11.5px; }
</style>
</head>
<body>
<div class="aura"></div>
<main>
  <div class="dot">⏳</div>
  <h1 id="title">老师还没有开始上课</h1>
  <p><span class="name" id="name"></span><span id="hint"></span></p>
  <div class="row">
    <button class="primary" id="refresh" type="button">刷新</button>
    <button class="ghost" id="logout" type="button">退出登录</button>
  </div>
  <div class="tip">这节课开始后，这里会自动变成「进入课堂」。</div>
</main>
<script>
  const render = () => {
    const state = window.__LINGDONG_STATE__ || {}
    if (state.name) document.getElementById('name').textContent = String(state.name) + '，'
    document.getElementById('hint').textContent = String(state.message || '老师还没有开始上课')
  }
  window.__lingdongRender = render
  render()
  document.getElementById('refresh').addEventListener('click', async () => {
    const button = document.getElementById('refresh')
    button.disabled = true
    button.textContent = '检查中…'
    await window.lingdong.gate({ action: 'refresh' })
  })
  document.getElementById('logout').addEventListener('click', () => { void window.lingdong.gate({ action: 'logout' }) })
</script>
</body>
</html>
