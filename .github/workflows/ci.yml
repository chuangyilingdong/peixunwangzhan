name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check server and acceptance scripts
        run: |
          node --check apps/server/src/routes/communication.js
          node --check apps/server/src/services/reminderScheduler.js
          node --check apps/server/src/routes/adminOrg.js
          node --check scripts/p4-02-demo-data-inventory.mjs
          node --check scripts/p4-o09-reminders.mjs
          node --check scripts/p9-live-security-smoke.mjs

      - name: Run isolated acceptance tests
        run: |
          node p4-01-state-machine.mjs
          node scripts/p4-02-demo-data-inventory.mjs
          node scripts/p4-o09-reminders.mjs

      - name: Build all four apps
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-kids-platform-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
